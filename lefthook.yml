pre-commit:
  commands:
    format:
      priority: 2
      glob: "*.{js,ts,tsx,json,md,yml,yaml}"
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    lint:
      glob: "*.{js,ts,tsx}"
      run: pnpm exec eslint --max-warnings 0 --no-warn-ignored {staged_files}

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
