name: Publish pre-trained ranking image

on:
  push:
    branches: [dev, main]
    tags: ["ranking-v*"]
    paths:
      - "apps/ranking/**"
      - ".github/workflows/ranking-image.yml"
  pull_request:
    branches: [dev, main]
    paths:
      - "apps/ranking/**"
      - ".github/workflows/ranking-image.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: djonnistorm/hh-but-it-works-ranking

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/ranking/requirements-dev.txt
            apps/ranking/requirements-ml.txt

      - name: Verify source, data and pre-trained artifacts
        working-directory: apps/ranking
        run: |
          sudo apt-get update
          sudo apt-get install -y libgomp1
          pip install -r requirements-dev.txt -r requirements-ml.txt
          sh scripts/check.sh
          sh scripts/verify_artifacts.sh evaluation/artifacts/ltr-v1.2.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        # Same-repo PRs also publish a pr-<n> tag so reviewers can pull and run
        # the exact pre-trained image before merging; fork PRs cannot push.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # The ready image must boot with the committed bundle and answer /rank
      # before anything is published; a green pytest alone is not enough.
      - name: Smoke-run ready image with committed artifacts
        uses: docker/build-push-action@v7
        with:
          context: apps/ranking
          platforms: linux/amd64
          load: true
          tags: ranking-smoke:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Exercise /health and /rank inside the built image
        run: |
          docker run -d --name ranking-smoke -p 8000:8000 ranking-smoke:local
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health | tee /tmp/health.json
          grep -q '"modelLoaded":true' /tmp/health.json
          curl -fsS -X POST http://127.0.0.1:8000/rank \
            -H 'content-type: application/json' \
            --data @apps/ranking/examples/rank-request.json | tee /tmp/rank.json
          grep -q '"modelVersion"' /tmp/rank.json
          python3 - <<'PY'
          import json
          body = json.load(open("/tmp/rank.json"))
          assert body["results"], body
          assert all(0.0 <= item["matchScore"] <= 1.0 for item in body["results"]), body
          print("ranked:", [(i["candidateId"], i["matchScore"]) for i in body["results"]])
          PY
          docker rm -f ranking-smoke

      - name: Build and publish ready-to-run image
        # Fork PRs get a full test + smoke-run but no GHCR push (read-only token).
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/build-push-action@v7
        with:
          context: apps/ranking
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
