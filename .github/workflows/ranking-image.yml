name: Publish pre-trained ranking image

on:
  push:
    branches: [dev, main]
    tags: ["ranking-v*"]
    paths:
      - "apps/ranking/**"
      - ".github/workflows/ranking-image.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: djonnistorm/hh-but-it-works-ranking

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/ranking/requirements-dev.txt
            apps/ranking/requirements-ml.txt

      - name: Verify source, data and pre-trained artifacts
        working-directory: apps/ranking
        run: |
          sudo apt-get update
          sudo apt-get install -y libgomp1
          pip install -r requirements-dev.txt -r requirements-ml.txt
          sh scripts/check.sh
          sh scripts/verify_artifacts.sh evaluation/artifacts/ltr-v1.1.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and publish ready-to-run image
        uses: docker/build-push-action@v7
        with:
          context: apps/ranking
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
